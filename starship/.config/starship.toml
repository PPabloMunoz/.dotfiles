"$schema" = 'https://starship.rs/config-schema.json'

format = """\
[╭╴](fg:arrow)\
$username\
$os\
$git_branch\
$git_status\
( \
    at \
    $directory\
)\
$cmd_duration\
(\
    via \
    $java\
    $nodejs\
    $bun\
    $c\
    $golang\
)
[╰─](fg:arrow)$character\
"""
# Add the modules you need

# Disable the blank line at the start of the prompt
add_newline = true


palette = "normal"


[palettes.normal]
arrow = "#333533"
os = "#16f4d0"
os_admin = "#e4ff1a"
directory = "#9ffff5"
time = "#bdfffd"
git = "#f17f29"
git_status = "#DFEBED"
node = "#a5e6ba"
bun = "#fbf0df"
java = "#F86279"
clang = "#caf0f8"
golang = "#01ACD9"
duration = "#ce4257"
text_color = "#EDF2F4"
text_light = "#26272A"

# I disabled some modules (Rust, Java...) since some things aren't installed in my machine, enable them if you need.

[username]
style_user = 'bold os'
style_root = 'bold os_admin'
format = '[  $user](fg:$style) '
disabled = false
show_always = true

[character]
success_symbol = "[󰍟](fg:arrow)"
error_symbol = "[󰍟](fg:red)"

[line_break]
disabled = false

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:directory"
read_only_style = "fg:directory"
before_repo_root_style = "fg:directory"
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "

[time]
disabled = true
format = "at [󱑈 $time]($style)"
time_format = "%H:%M"
style = "bold fg:time"

[cmd_duration]
format = "took [ $duration]($style) "
style = "bold fg:duration"
min_time = 500

[git_branch]
format = "via [$symbol$branch]($style) "
style = "bold fg:git"
symbol = " "

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "fg:git"

[docker_context]
symbol = " "

[fill]
symbol = " "

[nodejs]
format = "[ $symbol$version ]($style)"
style = "bg:node fg:text_light"
symbol = "󰎙 "
version_format = "${raw}"

[bun]
format = '[ $symbol$version ]($style)'
style = "bg:bun fg:text_light"
symbol = " "
version_format = "${raw}"

[java]
format = "[ $symbol$version ]($style)"
style = "bg:java fg:text_light"
version_format = "${raw}"
symbol = " "

[c]
format = "[ $symbol($version(-$name)) ]($style)"
style = "bg:clang fg:text_light"
symbol = " "
version_format = "${raw}"

[golang]
format = '[ $symbol$version ]($style)'
style = "bg:clang fg:text_light"
symbol = " "
