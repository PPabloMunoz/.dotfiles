# Basic, sensible defaults (2025 edition)

[mgr]
# General look & behavior
show_hidden   = true          # Press `a` to toggle instead of always showing
show_symlink  = true
sort_by       = "natural"     # natural, mtime, size, etc.
sort_reverse  = false
sort_dir_first = true
sort_sensitive = false        # case-insensitive sorting

ratio = [ 1, 3, 4 ]           # parent : current : preview panes (classic layout)

# Mouse
mouse_enabled = true

# Preview settings
[preview]
max_width   = 1000
max_height  = 1000
image_delay = 50              # ms before showing image preview
cache_dir   = "~/.cache/yazi/preview"

# Log file (very useful when something feels broken)
[log]
enabled = false               # Set to true if you need to debug
